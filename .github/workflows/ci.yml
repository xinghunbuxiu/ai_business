name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload A2API runtime conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2api-runtime-conformance-${{ github.sha }}
          path: artifacts/a2api-runtime-conformance.json
          if-no-files-found: warn
          retention-days: 30

  verify-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify A2API Java SDK
        run: mvn -B -f sdks/java/pom.xml test
